version: "3.9"

services:
  chaturvima:
    build:
      context: .
      dockerfile: dockerfile
    container_name: chaturvima-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Groq API
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Concurrency settings
      - MAX_CONCURRENT_GENERATIONS=${MAX_CONCURRENT_GENERATIONS:-1}
      - MAX_QUEUE_SIZE=${MAX_QUEUE_SIZE:-100}
      - GROQ_RATE_LIMIT_PER_MINUTE=${GROQ_RATE_LIMIT_PER_MINUTE:-30}
      - GROQ_TIMEOUT_SECONDS=${GROQ_TIMEOUT_SECONDS:-120}
      - GROQ_MAX_IN_FLIGHT=${GROQ_MAX_IN_FLIGHT:-1}
      - GROQ_REQUEST_SPACING_SECONDS=${GROQ_REQUEST_SPACING_SECONDS:-2}
      - GROQ_MAX_RETRIES=${GROQ_MAX_RETRIES:-3}
      - SECTION_PARALLEL_WORKERS=${SECTION_PARALLEL_WORKERS:-1}
      - SECTION_EXPANSION_MAX_ATTEMPTS=${SECTION_EXPANSION_MAX_ATTEMPTS:-0}
      - GROQ_MODEL=${GROQ_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      - GROQ_MODEL_1D=${GROQ_MODEL_1D:-meta-llama/llama-4-scout-17b-16e-instruct}
      - GROQ_MODEL_2D=${GROQ_MODEL_2D:-meta-llama/llama-4-scout-17b-16e-instruct}
      - GROQ_MODEL_3D=${GROQ_MODEL_3D:-meta-llama/llama-4-scout-17b-16e-instruct}
      - GROQ_MODEL_4D=${GROQ_MODEL_4D:-meta-llama/llama-4-scout-17b-16e-instruct}
      - GROQ_MODEL_FALLBACKS=${GROQ_MODEL_FALLBACKS:-meta-llama/llama-4-scout-17b-16e-instruct}
      - GROQ_ALLOWED_MODELS=${GROQ_ALLOWED_MODELS:-meta-llama/llama-4-scout-17b-16e-instruct}
      - JSON_REPORT_MAX_TOKENS=${JSON_REPORT_MAX_TOKENS:-8000}
      - JSON_REPORT_BATCH_MAX_TOKENS=${JSON_REPORT_BATCH_MAX_TOKENS:-8000}
      - JSON_REPORT_MAX_TOKENS_CAP=${JSON_REPORT_MAX_TOKENS_CAP:-4000}
      - JSON_REPORT_BATCH_MAX_TOKENS_CAP=${JSON_REPORT_BATCH_MAX_TOKENS_CAP:-6000}
      - JSON_REPORT_ALLOW_LARGE_SINGLE_CALL=${JSON_REPORT_ALLOW_LARGE_SINGLE_CALL:-false}
      - JSON_REPORT_LARGE_BATCH_SIZE=${JSON_REPORT_LARGE_BATCH_SIZE:-7}
      # Frappe authentication
      - FRAPPE_API_KEY=${FRAPPE_API_KEY}
      - FRAPPE_API_SECRET=${FRAPPE_API_SECRET}
      # Report storage
      - DATABASE_URL=${DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Persist vector DB and data
      - ./vector_db:/app/vector_db
      - ./data:/app/data
      - ./html_data:/app/html_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16
    container_name: chaturvima-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-chaturvima}
      - POSTGRES_USER=${POSTGRES_USER:-cv_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cv_password_123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cv_user} -d ${POSTGRES_DB:-chaturvima}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
