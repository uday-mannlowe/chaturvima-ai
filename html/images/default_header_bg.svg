<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="45%" stop-color="#1a1a6e"/>
      <stop offset="100%" stop-color="#1b3a5c"/>
    </linearGradient>
    <radialGradient id="glow1" cx="78%" cy="25%" r="38%">
      <stop offset="0%" stop-color="#6c5ce7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6c5ce7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="92%" cy="78%" r="32%">
      <stop offset="0%" stop-color="#0984e3" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0984e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="55%" cy="50%" r="25%">
      <stop offset="0%" stop-color="#a29bfe" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#a29bfe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base gradient -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Glow layers (right-side, away from the text overlay) -->
  <rect width="1200" height="400" fill="url(#glow1)"/>
  <rect width="1200" height="400" fill="url(#glow2)"/>
  <rect width="1200" height="400" fill="url(#glow3)"/>

  <!-- Large concentric rings — focal point right-centre -->
  <circle cx="1060" cy="130" r="310" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1.5"/>
  <circle cx="1060" cy="130" r="230" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <circle cx="1060" cy="130" r="155" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="1060" cy="130" r="88" fill="rgba(108,92,231,0.07)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="1060" cy="130" r="35" fill="rgba(108,92,231,0.12)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Secondary ring cluster — bottom right -->
  <circle cx="870" cy="370" r="200" fill="none" stroke="rgba(9,132,227,0.05)" stroke-width="1"/>
  <circle cx="870" cy="370" r="120" fill="none" stroke="rgba(9,132,227,0.07)" stroke-width="1"/>
  <circle cx="870" cy="370" r="55" fill="none" stroke="rgba(9,132,227,0.1)" stroke-width="1"/>

  <!-- Diagonal depth lines (faint) -->
  <line x1="580" y1="0" x2="1200" y2="400" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="640" y1="0" x2="1200" y2="330" stroke="rgba(255,255,255,0.020)" stroke-width="1"/>
  <line x1="700" y1="0" x2="1200" y2="260" stroke="rgba(255,255,255,0.015)" stroke-width="1"/>

  <!-- Network node dots -->
  <circle cx="760"  cy="75"  r="3.0" fill="rgba(255,255,255,0.22)"/>
  <circle cx="830"  cy="145" r="2.0" fill="rgba(255,255,255,0.16)"/>
  <circle cx="910"  cy="55"  r="2.5" fill="rgba(255,255,255,0.20)"/>
  <circle cx="985"  cy="205" r="2.0" fill="rgba(255,255,255,0.14)"/>
  <circle cx="1060" cy="48"  r="3.5" fill="rgba(108,92,231,0.55)"/>
  <circle cx="1115" cy="185" r="2.5" fill="rgba(9,132,227,0.45)"/>
  <circle cx="690"  cy="210" r="2.0" fill="rgba(255,255,255,0.12)"/>
  <circle cx="795"  cy="290" r="2.5" fill="rgba(255,255,255,0.14)"/>
  <circle cx="950"  cy="310" r="2.0" fill="rgba(9,132,227,0.30)"/>
  <circle cx="1040" cy="260" r="2.0" fill="rgba(255,255,255,0.12)"/>

  <!-- Connection lines between nodes -->
  <line x1="760"  y1="75"  x2="830"  y2="145" stroke="rgba(255,255,255,0.07)" stroke-width="0.8"/>
  <line x1="830"  y1="145" x2="910"  y2="55"  stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
  <line x1="910"  y1="55"  x2="1060" y2="48"  stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
  <line x1="1060" y1="48"  x2="1115" y2="185" stroke="rgba(108,92,231,0.18)" stroke-width="0.8"/>
  <line x1="985"  y1="205" x2="1115" y2="185" stroke="rgba(9,132,227,0.12)" stroke-width="0.8"/>
  <line x1="795"  y1="290" x2="950"  y2="310" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
  <line x1="950"  y1="310" x2="1040" y2="260" stroke="rgba(9,132,227,0.10)" stroke-width="0.8"/>
  <line x1="690"  y1="210" x2="760"  y2="75"  stroke="rgba(255,255,255,0.04)" stroke-width="0.8"/>

  <!-- Hexagonal accent — top right corner -->
  <polygon points="1158,18 1190,37 1190,74 1158,93 1126,74 1126,37"
           fill="none" stroke="rgba(255,255,255,0.065)" stroke-width="1.2"/>
  <polygon points="1158,34 1181,47 1181,73 1158,86 1135,73 1135,47"
           fill="none" stroke="rgba(108,92,231,0.12)" stroke-width="1"/>
  <circle cx="1158" cy="60" r="6" fill="rgba(108,92,231,0.25)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>

  <!-- Second hexagon — mid right -->
  <polygon points="1140,220 1164,234 1164,262 1140,276 1116,262 1116,234"
           fill="none" stroke="rgba(9,132,227,0.10)" stroke-width="1"/>
  <circle cx="1140" cy="248" r="5" fill="rgba(9,132,227,0.20)" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>

  <!-- Subtle bottom wave -->
  <path d="M 0 385 Q 300 355 620 375 Q 900 398 1200 368 L 1200 400 L 0 400 Z"
        fill="rgba(255,255,255,0.018)"/>
</svg>
